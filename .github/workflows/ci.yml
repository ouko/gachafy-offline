name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, type-check, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build
        env:
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_ONESIGNAL_SAFARI_WEB_ID: ${{ secrets.VITE_ONESIGNAL_SAFARI_WEB_ID }}
          VITE_RADIX_NETWORK: ${{ vars.VITE_RADIX_NETWORK || 'stokenet' }}
          VITE_RADIX_DAPP_DEFINITION: ${{ secrets.VITE_RADIX_DAPP_DEFINITION }}
          VITE_RADIX_GATEWAY_URL: ${{ vars.VITE_RADIX_GATEWAY_URL }}
          VITE_GACHA_PACKAGE_ADDRESS: ${{ vars.VITE_GACHA_PACKAGE_ADDRESS }}
          VITE_GACHA_COMPONENT_ADDRESS: ${{ vars.VITE_GACHA_COMPONENT_ADDRESS }}
          VITE_XRD_RESOURCE_ADDRESS: ${{ vars.VITE_XRD_RESOURCE_ADDRESS }}
          VITE_FEATURE_BRIDGE: ${{ vars.VITE_FEATURE_BRIDGE || 'false' }}
          VITE_FEATURE_OFFLINE_QUEUE: ${{ vars.VITE_FEATURE_OFFLINE_QUEUE || 'false' }}
          VITE_FEATURE_CREATOR_DASHBOARD: ${{ vars.VITE_FEATURE_CREATOR_DASHBOARD || 'true' }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Check bundle size
        run: npm run check:bundle

      - name: Upload build artefact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+)
        run: npm audit --audit-level=high

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --only-verified
