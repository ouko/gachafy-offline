server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers --------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # X-XSS-Protection is deprecated in modern browsers; keep for legacy.
    add_header X-XSS-Protection "0" always;

    # HSTS — only safe to enable when the site is exclusively served over HTTPS.
    # The TLS-terminating proxy in front of this container should also set this,
    # but it doesn't hurt to set it here. Comment out if you serve plain HTTP.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy.
    # NOTE: 'unsafe-inline' for styles is required by Tailwind/CSS-in-JS bits;
    # we drop 'unsafe-eval'. Adjust 'connect-src' if you change the network or
    # add server-side endpoints.
    add_header Content-Security-Policy "default-src 'self'; \
script-src 'self' 'unsafe-inline' https://cdn.onesignal.com; \
style-src 'self' 'unsafe-inline'; \
font-src 'self'; \
img-src 'self' data: https:; \
connect-src 'self' \
  https://babylon-stokenet-gateway.radixdlt.com \
  https://stokenet.radixdlt.com \
  https://mainnet.radixdlt.com \
  https://onesignal.com \
  https://*.onesignal.com \
  wss://*.onesignal.com; \
worker-src 'self' blob:; \
manifest-src 'self'; \
frame-ancestors 'self'; \
base-uri 'self'; \
form-action 'self';" always;

    # ---- Compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # ---- Caching -----------------------------------------------------------
    # Hashed Vite build assets are content-addressed → cache aggressively.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service workers — never cache.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }
    location = /OneSignalSDKWorker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA routing — every unmatched path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health check.
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
